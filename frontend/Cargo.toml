[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

# Exclude from the parent workspace so Trunk can manage this crate independently
[workspace]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
gloo-net = { version = "0.5", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
sudoku-core = { path = "../sudoku-core" }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement"] }
wasm-bindgen-futures = "0.4"
rand = { version = "0.8", features = ["small_rng"] }

[[bin]]
name = "frontend"
path = "src/main.rs"
